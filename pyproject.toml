
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriquery"
version = "0.1.0"
description = "Trustworthy Natural-Language Analytics for Relational Databases"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "groq",
    "python-dotenv",
    "pydantic>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
